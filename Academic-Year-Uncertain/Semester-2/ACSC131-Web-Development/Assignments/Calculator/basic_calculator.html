<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator</title>
	<link rel="stylesheet" href="basic_calculator.css">
</head>

<body>
	<div class="container">
		<p>
			This component works exactly like the calculator you know. Click any number to start calculating!
		</p>
		<div class="calculator">
			<p id="result" class="calculator_display"></p>

			<div class="calculator_keys">
				<!-- Operator buttons -->
				<input type="button" class="key-operator" value="+" onclick="display('+')">
				<input type="button" class="key-operator" value="-" onclick="display('-')">
				<input type="button" class="key-operator" value="*" onclick="display('*')">
				<input type="button" class="key-operator" value="/" onclick="display('/')">

				<!-- Number buttons -->
				<input type="button" value="7" onclick="display('7')">
				<input type="button" value="8" onclick="display('8')">
				<input type="button" value="9" onclick="display('9')">
				<input type="button" value="4" onclick="display('4')">
				<input type="button" value="5" onclick="display('5')">
				<input type="button" value="6" onclick="display('6')">
				<input type="button" value="1" onclick="display('1')">
				<input type="button" value="2" onclick="display('2')">
				<input type="button" value="3" onclick="display('3')">
				<input type="button" value="0" onclick="display('0')">

				<input type="button" value="." onclick="display('.')">
				<!-- Clear button -->

				<input type="button" value="C" onclick="clr()">
				<!-- Equal sign button -->
				<input type="button" class="key-equal" value="=" onclick="solve()">
				<!-- Decimal point -->

			</div>
		</div>
	</div>
	<script src="basic_calculator.js"></script>
</body>

</html>
